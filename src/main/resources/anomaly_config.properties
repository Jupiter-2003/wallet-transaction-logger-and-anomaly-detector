# Anomaly Detection Engine — tunable thresholds
# Loaded by com.walletlogger.anomaly.AnomalyConfig at startup.
# Any missing/invalid value causes an AnomalyConfigException to be thrown.

# AMOUNT_SPIKE — flag a transaction whose amount is more than this many
# standard deviations above the user's running mean.
spike.zscore.threshold=3.0
# Minimum number of prior transactions required before spike detection
# kicks in (avoids false positives on brand-new users).
spike.min.samples=3

# HIGH_VELOCITY — flag when a user makes more than this many transactions
# within the rolling time window (seconds).
velocity.max.count=4
velocity.window.seconds=60

# DORMANT_SPIKE — flag a large transaction that arrives after a long
# silence from a previously active user.
dormant.days.threshold=30
dormant.amount.multiplier=2.0

# DUPLICATE_ATTEMPT — flag two transactions to the same vendor for the
# same amount within this many seconds (looks like a retried/duplicated payment).
duplicate.window.seconds=30

# UNUSUAL_HOUR — flag transactions whose local hour-of-day falls outside
# [unusual.hour.start, unusual.hour.end).
unusual.hour.start=6
unusual.hour.end=23
